name: Check Newton street mentions

on:
  schedule:
    # Main Clark Street monitor: once daily at 12:00 UTC.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from racing when they commit seen_matches.json.
concurrency:
  group: newtonsearch-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out repo
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # 2,500 proved too large once OCR was enabled: the first live
          # backfill hit the 5.5-hour job timeout at document 1,877.
          # 1,000 keeps each daily batch comfortably bounded while new IDs
          # always remain first priority.
          MAX_PDFS_PER_RUN: '1000'
          MAX_MONTHLY_RECHECKS: '250'
          INTEGRITY_RECHECK_EVERY_RUNS: '30'
          MAX_FAILED_RETRIES_PER_RUN: '100'
          CHECKPOINT_EVERY_PDFS: '25'
          OCR_DPI: '170'
          OCR_NATIVE_TEXT_THRESHOLD: '120'
          OCR_PAGE_TIMEOUT_SECONDS: '30'
          # One pathological PDF previously blocked inside PyMuPDF for hours.
          # Run each PDF extraction in a killable child process and skip it
          # after 10 minutes rather than failing the entire workflow.
          MAX_PDF_PROCESS_SECONDS: '600'
          # Exit cleanly after ~4.5 hours so the run can save/commit progress
          # instead of GitHub marking the step as timed out.
          CHECKER_TIME_BUDGET_SECONDS: '16200'
        timeout-minutes: 300
        run: python check_newton.py

      - name: Commit monitor state
        # The checker writes atomic checkpoints every 25 documents. Keep a
        # 30-minute cushion after the checker timeout so partial progress can
        # still be committed instead of being lost.
        if: always() && steps.checkout.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_matches.json
          git commit -m "Update seen matches" || echo "No monitor-state changes"
          git pull --rebase origin main
          git push

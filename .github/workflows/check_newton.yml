name: Check Newton street mentions

on:
  schedule:
    # Main Clark Street monitor: once daily at 12:00 UTC.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Prevent overlapping runs from racing when they commit seen_matches.json.
concurrency:
  group: newtonsearch-state
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAX_PDFS_PER_RUN: '2500'
          MAX_PDF_RECHECKS_PER_RUN: '500'
          OCR_DPI: '170'
          OCR_NATIVE_TEXT_THRESHOLD: '120'
        run: python check_newton.py

      - name: Commit monitor state
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add seen_matches.json
          git commit -m "Update seen matches" || echo "No monitor-state changes"
          git pull --rebase origin main
          git push
